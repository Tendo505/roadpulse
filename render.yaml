# One-click deploy to Render (free tier): https://render.com/deploy?repo=https://github.com/Tendo505/roadpulse
services:
  - type: web
    name: roadpulse-api
    runtime: docker
    rootDir: server
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: ROADPULSE_SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: roadpulse-db
          property: connectionString
databases:
  - name: roadpulse-db
    plan: free
