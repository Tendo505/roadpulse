name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests (H2 + PostgreSQL) & Docker build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roadpulse
          POSTGRES_USER: roadpulse
          POSTGRES_PASSWORD: roadpulse
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roadpulse" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests on in-memory H2
        run: ./gradlew test --console=plain
      - name: Tests on real PostgreSQL 16
        run: ./gradlew cleanTest test --console=plain
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/roadpulse
          SPRING_DATASOURCE_USERNAME: roadpulse
          SPRING_DATASOURCE_PASSWORD: roadpulse
      - name: Docker image builds
        run: docker build -t roadpulse-server .

  android:
    name: Android tests & APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install SDK packages (runner image ships the Android SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.1.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + Robolectric tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Release APKs (R8 minified)
        run: ./gradlew assembleRelease --console=plain
      - name: Name APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-universal-release.apk "out/RoadPulse-${GITHUB_REF_NAME}-universal.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/RoadPulse-${GITHUB_REF_NAME}-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: roadpulse-apks
          path: android/out/*.apk

  release:
    name: Publish GitHub release
    needs: [server, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: roadpulse-apks }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" RoadPulse-*.apk --repo "${{ github.repository }}" \
            --title "RoadPulse ${{ github.ref_name }}" \
            --notes "**Which file?** Most phones: \`arm64\` (smaller). Not sure, or an older phone: \`universal\` (works on every Android 8.0+ device).

          Works anywhere in the world straight after install: maps, search and turn-by-turn directions. Reports stay on your phone until you connect a community server in Settings."
