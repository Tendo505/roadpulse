# docker compose up --build   ->   RoadPulse API on http://localhost:8080 (docs at /docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roadpulse
      POSTGRES_USER: roadpulse
      POSTGRES_PASSWORD: roadpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadpulse"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/roadpulse
      SPRING_DATASOURCE_USERNAME: roadpulse
      SPRING_DATASOURCE_PASSWORD: roadpulse
      ROADPULSE_SEED_DEMO: "false"
    ports:
      - "8080:8080"

volumes:
  pgdata:
